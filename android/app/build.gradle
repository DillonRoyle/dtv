plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
// Bump android/native-version.txt only when the Java/player side changes.
// Screen-only changes keep it the same, so the Firestick updates itself without a reinstall.
def nativeVersion = rootProject.file('native-version.txt').text.trim().toInteger()
def repo = System.getenv('GITHUB_REPOSITORY') ?: 'DillonRoyle/dtv'

android {
    namespace 'app.dtv.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.dtv.tv'
        minSdk 21
        targetSdk 34
        versionCode nativeVersion
        versionName "1.${nativeVersion}.${runNumber}"
        buildConfigField 'int', 'NATIVE_VERSION', "${nativeVersion}"
        buildConfigField 'int', 'WEB_VERSION', "${runNumber}"
        buildConfigField 'String', 'UPDATE_BASE', "\"https://github.com/${repo}/releases/latest/download/\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            storeFile file('../dtv-release.jks')
            storePassword 'dtvtv-2026'
            keyAlias 'dtv'
            keyPassword 'dtvtv-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    androidResources {
        // keep the web app's files exactly as they are
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    def media3 = '1.4.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.core:core:1.13.1'
}
